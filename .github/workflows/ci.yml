name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Toolchain (from rust-toolchain.toml)
        run: rustup show active-toolchain || rustup toolchain install
      - run: cargo fmt --all --check
      - run: cargo clippy -q --all-targets --locked -- -D warnings
      - run: cargo test -q --locked

  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 --version
      - run: python3 -m unittest discover -s orchestrator/tests -q
      - run: python3 -m unittest discover -s bench/tests -q

  drc:
    name: DRC smoke (KiCad ${{ matrix.kicad }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        kicad: ["9.0", "10.0"]
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build --build-arg KICAD_TAG=${{ matrix.kicad }} -f docker/Dockerfile -t kal-drc:${{ matrix.kicad }} .
      - name: Run DRC on smoke board
        run: |
          mkdir -p out
          set +e
          docker run --rm --user "$(id -u):$(id -g)" -e HOME=/tmp -v "$PWD:/work" \
            kal-drc:${{ matrix.kicad }} bench/boards/smoke/smoke.kicad_pcb out | tee out/summary.txt
          rc=${PIPESTATUS[0]}
          set -e
          echo "drc exit code: $rc"
          # The smoke board has one deliberate clearance violation.
          test "$rc" -eq 1
          grep -q "clearance" out/summary.txt
          python3 -c "import json; s=json.load(open('out/summary.json')); assert s['sections']['violations']['by_type'].get('clearance', 0) >= 1, s"
      - name: Generated rules are applied by KiCad
        run: |
          drc() {
            docker run --rm --user "$(id -u):$(id -g)" -e HOME=/tmp -v "$PWD:/work" \
              kal-drc:${{ matrix.kicad }} "$1" "$2" >"$2.log" 2>&1 || true
            tail -n 20 "$2.log"
          }
          # Without rules: no clearance or track_width errors.
          mkdir -p out/rules-base out/rules
          cp bench/boards/rules/rules.kicad_pcb bench/boards/rules/rules.kicad_pro out/rules-base/
          drc out/rules-base/rules.kicad_pcb out/rules-base/drc
          # With rules generated from the constraints: both must appear.
          cp bench/boards/rules/rules.kicad_pcb bench/boards/rules/rules.kicad_pro out/rules/
          python3 orchestrator/dru.py bench/boards/rules/constraints.json -o out/rules/rules.kicad_dru
          drc out/rules/rules.kicad_pcb out/rules/drc
          python3 - <<'EOF'
          import json
          def types(d):
              return json.load(open(f"{d}/summary.json"))["sections"]["violations"]["by_type"]
          base, ruled = types("out/rules-base/drc"), types("out/rules/drc")
          print("without rules:", base)
          print("with rules:   ", ruled)
          for t in ("clearance", "track_width"):
              assert base.get(t, 0) == 0, f"{t} reported without rules"
              assert ruled.get(t, 0) >= 1, f"generated {t} rule not applied"
          EOF
      - name: Generated netclasses are applied by KiCad
        run: |
          # Netclass HV (clearance 0.5 mm) assigned to HV1 by pattern, no .kicad_dru: the
          # clearance error can only come from the generated project file.
          mkdir -p out/netclass
          cp bench/boards/rules/rules.kicad_pcb out/netclass/
          python3 orchestrator/netclass.py bench/boards/rules/netclass.json \
            bench/boards/rules/rules.kicad_pro -o out/netclass/rules.kicad_pro
          docker run --rm --user "$(id -u):$(id -g)" -e HOME=/tmp -v "$PWD:/work" \
            kal-drc:${{ matrix.kicad }} out/netclass/rules.kicad_pcb out/netclass/drc \
            >out/netclass/drc.log 2>&1 || true
          tail -n 20 out/netclass/drc.log
          python3 - <<'EOF'
          import json
          t = json.load(open("out/netclass/drc/summary.json"))["sections"]["violations"]["by_type"]
          print("with netclasses:", t)
          assert t.get("clearance", 0) >= 1, "generated netclass clearance not applied"
          EOF
      - name: Upload DRC output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: drc-kicad-${{ matrix.kicad }}
          path: out/

  roundtrip:
    name: Round-trip corpus (KiCad ${{ matrix.kicad }})
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        kicad: ["9.0", "10.0"]
    steps:
      - uses: actions/checkout@v4
      - name: Build kal-roundtrip, kal-summary and kal-place
        run: cargo build -q --release --locked --bin kal-roundtrip --bin kal-summary --bin kal-place
      - name: Build DRC image
        run: docker build --build-arg KICAD_TAG=${{ matrix.kicad }} -f docker/Dockerfile -t kal-drc:${{ matrix.kicad }} .
      - name: Collect corpus (KiCad demos from the image + bench boards)
        run: |
          mkdir -p corpus
          cid=$(docker create kal-drc:${{ matrix.kicad }})
          docker cp "$cid:/usr/share/kicad/demos" corpus/kicad-demos || true
          docker rm "$cid" >/dev/null
          if [ ! -d corpus/kicad-demos ]; then
            echo "no /usr/share/kicad/demos in image; boards found in image:"
            docker run --rm --entrypoint bash kal-drc:${{ matrix.kicad }} -c \
              "find / -name '*.kicad_pcb' -not -path '/proc/*' 2>/dev/null | head -n 20"
          fi
          cp -r bench/boards corpus/bench
          echo "boards: $(find corpus -name '*.kicad_pcb' | wc -l)"
      - name: Board summaries are valid JSON
        run: |
          fail=0
          while IFS= read -r b; do
            if ! target/release/kal-summary "$b" | python3 -c 'import json, sys; json.load(sys.stdin)'; then
              echo "summary failed: $b"
              fail=1
            fi
          done < <(find corpus -name '*.kicad_pcb' | sort)
          exit "$fail"
      - name: Placement baseline (report only; fails on a crash or a 120 s timeout)
        run: |
          fail=0
          printf 'board\tparts\tfixed\toff_grid\tcurrent_wl_mm\tcurrent_legal\tshelf\n'
          while IFS= read -r b; do
            rc=0
            out=$(timeout 120 target/release/kal-place "$b" 2>&1) || rc=$?
            if [ "$rc" -gt 2 ]; then
              echo "kal-place crashed or timed out (exit $rc) on $b"; echo "$out" | tail -n 5; fail=1; continue
            fi
            printf '%s' "$out" | python3 -c '
          import json, sys
          b = sys.argv[1]
          try:
              r = json.load(sys.stdin)
          except ValueError:
              print(f"{b}\t-\t-\t-\t-\t-\tno report"); sys.exit()
          c, res = r["current"], r["result"]
          shelf = res.get("error") or ("legal" if res["legal"] else "illegal")
          row = [b, r["parts"], r["fixed"], r["off_grid"], round(c["wirelength_nm"] / 1e6, 1)]
          print("\t".join(map(str, row + [c["legal"], shelf])))
          ' "$b"
          done < <(find corpus -name '*.kicad_pcb' | sort)
          exit "$fail"
      - name: Round-trip + DRC compare
        run: bash bench/roundtrip.sh target/release/kal-roundtrip kal-drc:${{ matrix.kicad }} out/roundtrip corpus
      - name: Upload round-trip report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: roundtrip-kicad-${{ matrix.kicad }}
          path: |
            out/roundtrip/report.tsv
            out/roundtrip/**/*.log
            out/roundtrip/**/drc-diff.txt
