name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Toolchain (from rust-toolchain.toml)
        run: rustup show active-toolchain || rustup toolchain install
      - run: cargo fmt --all --check
      - run: cargo clippy -q --all-targets --locked -- -D warnings
      - run: cargo test -q --locked

  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 --version
      - run: python3 -m unittest discover -s orchestrator/tests -q
      - run: python3 -m unittest discover -s bench/tests -q

  drc:
    name: DRC smoke (KiCad ${{ matrix.kicad }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        kicad: ["9.0", "10.0"]
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build --build-arg KICAD_TAG=${{ matrix.kicad }} -f docker/Dockerfile -t kal-drc:${{ matrix.kicad }} .
      - name: Run DRC on smoke board
        run: |
          mkdir -p out
          set +e
          docker run --rm --user "$(id -u):$(id -g)" -e HOME=/tmp -v "$PWD:/work" \
            kal-drc:${{ matrix.kicad }} bench/boards/smoke/smoke.kicad_pcb out | tee out/summary.txt
          rc=${PIPESTATUS[0]}
          set -e
          echo "drc exit code: $rc"
          # The smoke board has one deliberate clearance violation.
          test "$rc" -eq 1
          grep -q "clearance" out/summary.txt
          python3 -c "import json; s=json.load(open('out/summary.json')); assert s['sections']['violations']['by_type'].get('clearance', 0) >= 1, s"
      - name: Generated rules are applied by KiCad
        run: |
          drc() {
            docker run --rm --user "$(id -u):$(id -g)" -e HOME=/tmp -v "$PWD:/work" \
              kal-drc:${{ matrix.kicad }} "$1" "$2" >"$2.log" 2>&1 || true
            tail -n 20 "$2.log"
          }
          # Without rules: no clearance or track_width errors.
          mkdir -p out/rules-base out/rules
          cp bench/boards/rules/rules.kicad_pcb bench/boards/rules/rules.kicad_pro out/rules-base/
          drc out/rules-base/rules.kicad_pcb out/rules-base/drc
          # With rules generated from the constraints: both must appear.
          cp bench/boards/rules/rules.kicad_pcb bench/boards/rules/rules.kicad_pro out/rules/
          python3 orchestrator/dru.py bench/boards/rules/constraints.json -o out/rules/rules.kicad_dru
          drc out/rules/rules.kicad_pcb out/rules/drc
          python3 - <<'EOF'
          import json
          def types(d):
              return json.load(open(f"{d}/summary.json"))["sections"]["violations"]["by_type"]
          base, ruled = types("out/rules-base/drc"), types("out/rules/drc")
          print("without rules:", base)
          print("with rules:   ", ruled)
          for t in ("clearance", "track_width"):
              assert base.get(t, 0) == 0, f"{t} reported without rules"
              assert ruled.get(t, 0) >= 1, f"generated {t} rule not applied"
          EOF
      - name: Upload DRC output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: drc-kicad-${{ matrix.kicad }}
          path: out/

  roundtrip:
    name: Round-trip corpus (KiCad ${{ matrix.kicad }})
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        kicad: ["9.0", "10.0"]
    steps:
      - uses: actions/checkout@v4
      - name: Build kal-roundtrip
        run: cargo build -q --release --locked --bin kal-roundtrip
      - name: Build DRC image
        run: docker build --build-arg KICAD_TAG=${{ matrix.kicad }} -f docker/Dockerfile -t kal-drc:${{ matrix.kicad }} .
      - name: Collect corpus (KiCad demos from the image + bench boards)
        run: |
          mkdir -p corpus
          cid=$(docker create kal-drc:${{ matrix.kicad }})
          docker cp "$cid:/usr/share/kicad/demos" corpus/kicad-demos || true
          docker rm "$cid" >/dev/null
          if [ ! -d corpus/kicad-demos ]; then
            echo "no /usr/share/kicad/demos in image; boards found in image:"
            docker run --rm --entrypoint bash kal-drc:${{ matrix.kicad }} -c \
              "find / -name '*.kicad_pcb' -not -path '/proc/*' 2>/dev/null | head -n 20"
          fi
          cp -r bench/boards corpus/bench
          echo "boards: $(find corpus -name '*.kicad_pcb' | wc -l)"
      - name: Round-trip + DRC compare
        run: bash bench/roundtrip.sh target/release/kal-roundtrip kal-drc:${{ matrix.kicad }} out/roundtrip corpus
      - name: Upload round-trip report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: roundtrip-kicad-${{ matrix.kicad }}
          path: |
            out/roundtrip/report.tsv
            out/roundtrip/**/*.log
            out/roundtrip/**/drc-diff.txt
